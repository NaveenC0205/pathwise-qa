[project]
name = "pathwise-qa"
version = "0.1.0"
description = "Standalone multi-agent shift-left QA design workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.31", "pydantic>=2.12,<3", "pydantic-settings>=2.5", "httpx>=0.27,<1", "python-multipart>=0.0.9", "mcp>=1.30,<2", "openpyxl>=3.1,<4", "defusedxml>=0.7", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build && rm -rf ui && mkdir ui && cp -R frontend/dist/. ui/"
